[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-provenance-knowledge"
version = "0.1.0"
description = "Machine-readable, evidence-backed knowledge about open software provenance standards"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "mkdocs-material>=9.6,<10",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
opk = "opk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["S310"]
"src/opk/core.py" = ["S310"]
"tests/*.py" = ["S101"]
